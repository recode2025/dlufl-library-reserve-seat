# 大连外国语大学图书馆座位预约系统 Nginx 生产配置
# 放置路径示例：/etc/nginx/sites-available/dlufl-library.conf
# 启用示例：ln -s /etc/nginx/sites-available/dlufl-library.conf /etc/nginx/sites-enabled/
#
# 注意：
# 1. 将下方 your-domain.com 替换为你的实际域名
# 2. 将 backend/.env 中的 PUBLIC_BASE_URL 与 FRONTEND_URL 同步改为 https://your-domain.com
# 3. 后端固定监听 127.0.0.1:18301（PM2 管理），前端由 Nginx 直接托管静态产物或反代至 127.0.0.1:18517

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # 若尚未配置 HTTPS，可先注释下一行并直接使用下方 location 规则
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    # SSL 证书路径（可使用 certbot --nginx 自动生成）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    # 方式一（推荐）：Nginx 直接托管前端构建产物，性能最高、免额外进程
    root /opt/dlufl-library-reserve-seat/frontend/dist;
    index index.html;

    # 区域平面底图允许强缓存（避免被下方 /api/ 的 no-store 禁用缓存）
    location ~ ^/api/library/areas/[^/]+/floorplan$ {
        proxy_pass http://127.0.0.1:18301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # 后端 NestJS API 与 DLUFL-CAS 回调路由（端口 18301）
    location /api/ {
        proxy_pass http://127.0.0.1:18301;
        proxy_http_version 1.1;

        # 关键请求头：确保后端构造的 CAS service 回调地址与公网域名/协议 100% 一致
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 禁止缓存认证与实时座位接口
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;

        proxy_connect_timeout 15s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 前端静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # React SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 如果希望由 Nginx 反向代理到 PM2 托管的 Vite Preview（端口 18517），
    # 可注释上面的 root/index/location /assets/ 和 location /，改用下方配置：
    # location / {
    #     proxy_pass http://127.0.0.1:18517;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Host $host;
    # }
}
